<html>

<head>
	<meta http-equiv="content-type" content="text/html; charset=UTF-8">
	<meta charset="utf-8">
	<link rel="stylesheet" type="text/css" href="Veckopeng_files/style.css">


	<title>Veckopeng</title>
</head>

<body>
	<h1>Räkna ut din veckopeng med följande formulär:</h1>
	<script type="text/javascript">

		function skrivHTMLformulär() {
			//Skriver ut ett HTML-fomulär (<form>) med <input> för inmatning
			document.write("<form>")

			document.write("<input type = checkbox name = uppgift1 value = 1> ")
			document.write("Labb 1(Biljettpriser) = 1 bonuspoäng")
			document.write("<br>")

			document.write("<input type = checkbox name = uppgift2 value = 1> ")
			document.write("Labb 2(Funkioner och Slingor) = 1 bonuspoäng")
			document.write("<br>")

			document.write("<input type = checkbox name = uppgift3 value = 1> ")
			document.write("Labb 3(List, String och Dictionary) = 1 bonuspoäng")
			document.write("<br>")

			document.write("<input type = checkbox name = uppgift4 value = 1> ")
			document.write("Labb 4 (En klass) = 1 bonuspoäng")
			document.write("<br>")

			document.write("<input type = checkbox name = uppgift5 value = 1> ")
			document.write("Labb 5 (Lista av objekt) = 1 bonuspoäng")
			document.write("<br>")

			document.write("<input type = checkbox name = uppgift6 value = 1> ")
			document.write("Labb 6 (Set och arv) = 1 bonuspoäng")
			document.write("<br>")


			document.write("Hade du tidigare bonuspoäng? <input type = 'text' name = 'betygspoang' size = '2'>")
			document.write("<hr>")
			document.write("Tryck här för att räkna ut hur mycket du har nu: <input type = 'button' value = 'summera'>")
			document.write("<br>")
			document.write("Totalt <input type = 'text' name = 'totalt'  size = '10'> bonuspoäng")
			document.write("</form>")
		}

		skrivHTMLformulär()

	</script>



</body>

</html>
